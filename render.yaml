services:
  - type: web
    name: butiascore
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: 0
      - key: SESSION_COOKIE_SECURE
        value: 1
      - key: DATABASE_URL
        value: sqlite:////data/sofascore.db
    disk:
      name: butiascore-data
      mountPath: /data
      sizeGB: 1
